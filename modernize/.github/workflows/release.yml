name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & publish gem
    runs-on: ubuntu-latest
    # The environment name must match the trusted publisher configuration
    # on RubyGems.org. See README.md ("Releasing") for setup.
    environment: release
    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # to mint the OIDC token RubyGems exchanges for an API token

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run specs before publishing
        run: bundle exec rake spec

      - name: Publish to RubyGems via trusted publishing
        uses: rubygems/release-gem@v1
